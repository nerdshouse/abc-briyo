<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/brand/briyo-logo-square.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <title>No access yet — Briyo OS</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-body">
  <!-- A signed-in member with no module roles lands here instead of bouncing
       between pages they cannot open. An admin grants access in Members. -->
  <main class="login-card">
    <div class="login-brand"><img class="login-logo" src="/brand/briyo-logo.png" alt="Briyo Supplements" width="512" height="154" /><div><h1>No department yet</h1><p class="sub">Briyo OS</p></div></div>
    <p>You are signed in, but no department has been assigned to you yet.</p>
    <p>Ask an admin to give you access to a department — Logistics, Inventory, Support or HR — in <b>Members</b>. Once they do, reload this page.</p>
    <p><button type="button" id="reload">Reload</button> <button type="button" id="signOut">Sign out</button></p>
  </main>
  <script>
    document.getElementById('reload').addEventListener('click', () => { window.location.href = '/'; });
    document.getElementById('signOut').addEventListener('click', async () => {
      await fetch('/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    });
  </script>
</body>
</html>
