<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/brand/briyo-logo-square.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <title>Affiliate report — Briyo OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui.css" />
  <link rel="stylesheet" href="/orders.css" />
  <!-- The page script imports these; preloading fetches them in parallel instead of one after another. -->
  <link rel="modulepreload" href="/ui/components.js" />
  <link rel="modulepreload" href="/ui/nav.js" />
  <link rel="modulepreload" href="/affiliate-report.js" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="navOpen" type="button" aria-label="Open navigation"><i data-lucide="menu"></i></button>
      <span class="topbar-title" id="topTitle">Affiliate report</span>
    </header>

    <main class="page af" data-section="affiliate-report">
      <div class="crumbs" id="crumbs"><i data-lucide="chart-column"></i><span>Growth</span><span class="sep">/</span><a href="/affiliate-report" class="here">Affiliate report</a></div>
      <div class="page-head">
        <div style="min-width:0">
          <h1 class="page-title" id="pageTitle">Affiliate report</h1>
          <p class="page-sub" id="pageSub">Loading…</p>
        </div>
        <div class="page-actions" id="pageActions"></div>
      </div>

      <div id="alerts"></div>
      <div id="view"><section class="card"><div class="empty-note" aria-busy="true">Loading the report…</div></section></div>
      <p class="footnote" id="footnote">Days are Indian Standard Time. Orders are counted on the day they were placed; cancelled orders are counted apart and never in order value. Amounts are in rupees.</p>
    </main>
  </div>
</div>

<script type="module" src="/affiliate-report.js"></script>
</body>
</html>
