<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/brand/briyo-logo-square.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <title>Flipkart — Briyo OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui.css" />
  <link rel="stylesheet" href="/orders.css" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="navOpen" type="button" aria-label="Open navigation"><i data-lucide="menu"></i></button>
      <span class="topbar-title" id="topTitle">Flipkart</span>
    </header>

    <main class="page" data-section="logistics">
      <div class="crumbs">
        <i data-lucide="truck"></i><span>Logistics</span><span class="sep">/</span><span class="here">Flipkart</span>
      </div>
      <div class="page-head">
        <div>
          <h1 class="page-title">Flipkart</h1>
          <p class="page-sub">Flipkart orders come in by themselves through the Seller API; stock can be sent back to the Flipkart listings.</p>
        </div>
        <div class="page-actions">
          <button class="icon-btn" id="refresh" type="button" title="Refresh" aria-label="Refresh"><i data-lucide="refresh-cw"></i></button>
          <button class="btn" id="syncNow" type="button" hidden><i data-lucide="refresh-ccw"></i>Sync orders now</button>
          <button class="btn primary" id="pushNow" type="button" hidden><i data-lucide="upload"></i>Send stock now</button>
        </div>
      </div>
      <div id="alerts"></div>
      <div class="imp-stats inv-cards" id="cards"></div>
      <div id="body"><section class="card"><div class="pane"><div class="empty-note" role="status">Loading…</div></div></section></div>
    </main>
  </div>
</div>
<script type="module" src="/flipkart.js"></script>
</body>
</html>
