<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/brand/briyo-logo-square.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <title>Overview — Briyo OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui.css" />
  <link rel="stylesheet" href="/overview.css" />
  <!-- The page script imports these; preloading fetches them in parallel instead of one after another. -->
  <link rel="modulepreload" href="/ui/components.js" />
  <link rel="modulepreload" href="/ui/nav.js" />
  <link rel="modulepreload" href="/overview.js" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="navOpen" type="button" aria-label="Open navigation"><i data-lucide="menu"></i></button>
      <span class="topbar-title" id="topTitle">Overview</span>
    </header>

    <main class="page ov ox" data-section="overview">
      <header class="ox-head">
        <div class="ox-id">
          <p class="ox-date" id="ovDate">&nbsp;</p>
          <h1 class="ox-title">Overview</h1>
          <p class="ox-greet" id="ovHello">&nbsp;</p>
        </div>
        <div class="ox-actions">
          <span class="ox-updated" id="ovUpdated"></span>
          <button class="btn" id="ovRefresh" type="button"><i data-lucide="refresh-cw"></i><span>Refresh</span></button>
        </div>
      </header>

      <section class="ox-op" aria-label="Operating status">
        <div class="ox-op-sum"><span class="ox-op-label">Operating status</span><span class="ox-op-text" id="ovSub" aria-live="polite">Reading every department…</span></div>
        <nav class="ox-status" id="ovStatus" aria-label="Department status"></nav>
      </section>

      <div class="ox-body" id="ovDepts" aria-busy="true">
        <section class="ox-mod ox-skel" aria-hidden="true"><div class="ox-mod-head"><span class="sk w30"></span></div>
          <div class="ox-skel-grid"><span class="sk lg"></span><span class="sk lg"></span><span class="sk lg"></span><span class="sk lg"></span></div></section>
        <div class="ox-row"><section class="ox-mod ox-skel" aria-hidden="true"><div class="ox-mod-head"><span class="sk w30"></span></div><div class="ox-skel-grid"><span class="sk lg"></span><span class="sk lg"></span></div></section>
          <section class="ox-mod ox-skel" aria-hidden="true"><div class="ox-mod-head"><span class="sk w30"></span></div><div class="ox-skel-grid"><span class="sk lg"></span><span class="sk lg"></span></div></section></div>
      </div>

      <section class="ox-exc" id="ox-attention" aria-labelledby="ovAttnTitle">
        <header class="ox-exc-head"><h2 id="ovAttnTitle"><i data-lucide="siren"></i>Needs attention</h2><span class="ox-exc-meta" id="ovAttnMeta"></span></header>
        <div id="ovAttention"></div>
      </section>

      <p class="footnote">Every number is counted from live records when this page loads; nothing is estimated. Times are in India Standard Time; Meta's reporting day follows the ad account's timezone.</p>
    </main>
  </div>
</div>

<script type="module" src="/overview.js"></script>
</body>
</html>
