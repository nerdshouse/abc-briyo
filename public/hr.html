<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR — Briyo OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui.css" />
  <link rel="stylesheet" href="/orders.css" />
  <!-- The page script imports these; preloading fetches them in parallel instead of one after another. -->
  <link rel="modulepreload" href="/ui/components.js" />
  <link rel="modulepreload" href="/ui/nav.js" />
  <link rel="modulepreload" href="/hr.js" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="navOpen" type="button" aria-label="Open navigation"><i data-lucide="menu"></i></button>
      <span class="topbar-title" id="topTitle">HR</span>
    </header>

    <main class="page" data-section="hr">
      <div class="crumbs">
        <i data-lucide="briefcase"></i><span>HR</span><span class="sep">/</span><span class="here" id="crumbHere">Jobs</span>
      </div>
      <div class="page-head">
        <div>
          <h1 class="page-title" id="pageTitle">Jobs</h1>
          <p class="page-sub" id="pageSub">Loading…</p>
        </div>
        <div class="page-actions">
          <button class="icon-btn" id="refresh" type="button" title="Refresh" aria-label="Refresh"><i data-lucide="refresh-cw"></i></button>
          <button class="btn primary" id="newJob" type="button" hidden><i data-lucide="plus"></i>New job</button>
        </div>
      </div>

      <div id="alerts"></div>

      <section class="card">
        <div class="pane">
          <div class="board-filters" id="filters"></div>
          <div class="board-meta" id="resultNote" aria-live="polite"></div>
          <div class="table-wrap">
            <table class="table hr-table">
              <thead id="thead"></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <ul class="clist" id="clist"></ul>
        </div>
      </section>
      <p class="footnote" id="footnote"></p>
    </main>
  </div>
</div>

<div class="drawer-scrim" id="drawerScrim" hidden></div>
<aside class="drawer drawer-wide" id="drawer" hidden aria-label="Detail">
  <div class="drawer-head">
    <div style="min-width:0"><h2 class="drawer-title" id="dTitle"></h2><div class="drawer-sub" id="dSub"></div></div>
    <div class="drawer-nav"><button class="icon-btn" id="dClose" type="button" title="Close" aria-label="Close"><i data-lucide="x"></i></button></div>
  </div>
  <div class="drawer-body" id="dBody"></div>
  <div class="drawer-foot" id="dFoot">
    <span class="saved" id="dSaved" aria-live="polite"></span>
    <div style="display:flex;gap:8px" id="dButtons"></div>
  </div>
</aside>

<script type="module" src="/hr.js"></script>
</body>
</html>
