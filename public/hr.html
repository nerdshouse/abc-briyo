<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR — Briyo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ui.css" />
  <link rel="stylesheet" href="/orders.css" />
  <!-- The page script imports these; preloading fetches them in parallel instead of one after another. -->
  <link rel="modulepreload" href="/ui/components.js" />
  <link rel="modulepreload" href="/ui/nav.js" />
  <link rel="modulepreload" href="/hr.js" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <span class="brand-mark"><i data-lucide="package"></i></span>
      <div>
        <div class="brand-name">Briyo Operations</div>
        <div class="brand-sub">People &amp; hiring</div>
      </div>
    </div>

    <form class="side-search" id="sideSearchForm" role="search" data-recovery data-context="recovery">
      <i data-lucide="search"></i>
      <input id="sideSearch" type="search" placeholder="Find a customer" autocomplete="off"
             aria-label="Search every cart by name, phone or email" />
      <kbd>⌘ K</kbd>
    </form>

    <nav>
      <div class="nav-group" data-admin hidden>
        <div class="nav-caption">Overview</div>
        <a class="nav-item" href="/dashboard"><i data-lucide="layout-grid"></i>Dashboard</a>
      </div>

      <div class="nav-group" data-recovery>
        <div class="nav-caption">Carts</div>
        <a class="nav-item" href="/?mode=all" data-view-link="board"><i data-lucide="shopping-bag"></i>Call board</a>
        <div class="nav-tree">
          <a class="nav-item" href="/?mode=tocall" data-view-link="tocall">To call<span class="nav-count" id="countToCall" hidden></span></a>
          <a class="nav-item" href="/?mode=callbacks" data-view-link="callbacks">Callbacks<span class="nav-count" id="countCallbacks" hidden></span></a>
          <a class="nav-item" href="/?mode=mine" data-view-link="mine">My queue</a>
          <a class="nav-item" href="/?mode=all" data-view-link="all">All carts</a>
        </div>
      </div>

      <div id="ordersNav"></div>

      <div class="nav-group" data-admin hidden>
        <div class="nav-caption">Team</div>
        <a class="nav-item" href="/admin"><i data-lucide="users"></i>Members</a>
      </div>

      <div class="nav-group" data-admin data-context="recovery" hidden>
        <div class="nav-caption">Data</div>
        <a class="nav-item" href="/import"><i data-lucide="upload"></i>Import carts</a>
        <a class="nav-item" href="/api/admin/report.csv?period=day" download><i data-lucide="download"></i>Export report</a>
      </div>
    </nav>

    <div class="sidebar-foot">
      <div class="user-card">
        <span class="avatar" id="userAvatar">·<span class="live"></span></span>
        <div style="min-width:0">
          <div class="user-name" id="userName">Signed in</div>
          <div class="user-role" id="userRole"></div>
        </div>
        <button class="icon-btn bare" id="signOut" type="button" title="Sign out" aria-label="Sign out"><i data-lucide="log-out"></i></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="navOpen" type="button" aria-label="Open navigation"><i data-lucide="menu"></i></button>
      <span class="topbar-title" id="topTitle">HR</span>
    </header>

    <main class="page" data-section="hr">
      <div class="crumbs">
        <i data-lucide="briefcase"></i><span>HR</span><span class="sep">/</span><span class="here" id="crumbHere">Jobs</span>
      </div>
      <div class="page-head">
        <div>
          <h1 class="page-title" id="pageTitle">Jobs</h1>
          <p class="page-sub" id="pageSub">Loading…</p>
        </div>
        <div class="page-actions">
          <button class="icon-btn" id="refresh" type="button" title="Refresh" aria-label="Refresh"><i data-lucide="refresh-cw"></i></button>
          <button class="btn primary" id="newJob" type="button" hidden><i data-lucide="plus"></i>New job</button>
        </div>
      </div>

      <div id="alerts"></div>

      <section class="card">
        <div class="pane">
          <div class="board-filters" id="filters"></div>
          <div class="board-meta" id="resultNote" aria-live="polite"></div>
          <div class="table-wrap">
            <table class="table hr-table">
              <thead id="thead"></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <ul class="clist" id="clist"></ul>
        </div>
      </section>
      <p class="footnote" id="footnote"></p>
    </main>
  </div>
</div>

<div class="drawer-scrim" id="drawerScrim" hidden></div>
<aside class="drawer drawer-wide" id="drawer" hidden aria-label="Detail">
  <div class="drawer-head">
    <div style="min-width:0"><h2 class="drawer-title" id="dTitle"></h2><div class="drawer-sub" id="dSub"></div></div>
    <div class="drawer-nav"><button class="icon-btn" id="dClose" type="button" title="Close" aria-label="Close"><i data-lucide="x"></i></button></div>
  </div>
  <div class="drawer-body" id="dBody"></div>
  <div class="drawer-foot" id="dFoot">
    <span class="saved" id="dSaved" aria-live="polite"></span>
    <div style="display:flex;gap:8px" id="dButtons"></div>
  </div>
</aside>

<script type="module" src="/hr.js"></script>
</body>
</html>
